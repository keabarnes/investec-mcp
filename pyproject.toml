[project]
name = "investec-mcp"
version = "0.1.0"
description = "MCP server for integrating Investec Banking API into AI agents"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "mcp[cli]>=2.3,<3",
    "python-dotenv>=1.1.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
